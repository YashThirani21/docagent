[project]
name = "docagent"
version = "0.1.0"
description = "Private document agent: report QA + drawing extraction, fully local"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pillow",
  "pydantic>=2",
  "pyyaml",
  "openai>=1.40",
  "qdrant-client>=1.12",
  "FlagEmbedding>=1.3",
  "gradio>=4",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]

[project.scripts]
docagent = "docagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
